name: Publish Prime Grid albums to Cloudflare
on:
  push:
    branches: [preview-test-photoshoot]
    paths:
      - 'data/**'
      - 'images/uploads/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prime-grid-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prime-grid"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/prime-grid"
          rm -rf "$RUNNER_TEMP/prime-grid/.github"
          test -f "$RUNNER_TEMP/prime-grid/index.html"
          test -f "$RUNNER_TEMP/prime-grid/assets/app.js"
          test -f "$RUNNER_TEMP/prime-grid/data/portfolio.json"
          python -m json.tool "$RUNNER_TEMP/prime-grid/data/portfolio.json" > /dev/null
          python -m json.tool "$RUNNER_TEMP/prime-grid/data/albums.json" > /dev/null
          python - "$RUNNER_TEMP/prime-grid" <<'PY'
          import pathlib, json, sys
          root = pathlib.Path(sys.argv[1])
          for entry in json.loads((root/'data/albums.json').read_text(encoding='utf-8-sig')):
              for src in entry.get('photos', []):
                  assert isinstance(src,str) and src.startswith('/images/uploads/'), 'Invalid album image path'
                  p = (root/src.lstrip('/')).resolve()
                  assert p.is_relative_to(root/'images/uploads') and p.is_file(), f'Missing album image: {src}'
          for p in root.rglob('*'):
              if p.is_file() and p.stat().st_size > 25 * 1024 * 1024:
                  raise SystemExit(f'File exceeds Cloudflare Pages limit: {p.name}')
          PY
      - name: Install publishing tool
        run: npm install --prefix "$RUNNER_TEMP/prime-grid-tools" --no-audit --no-fund wrangler@4.168.0
      - name: Deploy to existing live Cloudflare project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '47c5910a78d7938b8505dd554a1de585'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret in GitHub before publishing."
            exit 1
          fi
          "$RUNNER_TEMP/prime-grid-tools/node_modules/.bin/wrangler" pages deploy "$RUNNER_TEMP/prime-grid" --project-name=the-prime-grid --branch=main --commit-hash="$GITHUB_SHA"

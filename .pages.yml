media:
  input: images/uploads
  output: /images/uploads
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: photos
    label: Individual Website Photos
    type: file
    path: data/portfolio.json
    format: json
    list: true
    fields:
      - name: title
        label: Photo Title
        type: string
        required: true
      - name: category
        label: Portfolio Category
        type: select
        required: true
        options:
          values:
            - { name: 'Portraits', label: 'Portraits' }
            - { name: 'Automotive', label: 'Automotive' }
            - { name: 'Sports', label: 'Sports' }
            - { name: 'Couples / weddings', label: 'Couples / weddings' }
            - { name: 'Travel / street', label: 'Travel / street' }
            - { name: 'Commercial / product', label: 'Commercial / products' }
            - { name: 'Personal projects', label: 'Personal projects' }
            - { name: 'Other', label: 'Other' }
      - name: session
        label: Session / Collection
        type: string
        description: Name of your photo session
      - name: placement
        label: Where Should It Show?
        type: select
        required: true
        options:
          values:
            - { name: 'Portfolio', label: 'Portfolio Gallery' }
            - { name: 'Homepage & Portfolio', label: 'Homepage Slideshow and Portfolio' }
            - { name: 'About', label: 'About Page Portrait' }
            - { name: 'Magazine', label: 'The Prime Magazine Cover' }
      - name: src
        label: Upload Photo
        type: image
        required: true
      - name: sample
        label: This Is a Sample Image
        type: boolean

  - name: albums
    label: Session Albums
    type: file
    path: data/albums.json
    format: json
    list: true
    fields:
      - name: title
        label: Session Name
        type: string
        required: true
        description: To add to an existing session, use its current name and category.
      - name: category
        label: Portfolio Category
        type: select
        required: true
        options:
          values:
            - { name: 'Portraits', label: 'Portraits' }
            - { name: 'Automotive', label: 'Automotive' }
            - { name: 'Sports', label: 'Sports' }
            - { name: 'Couples / weddings', label: 'Couples / weddings' }
            - { name: 'Travel / street', label: 'Travel / street' }
            - { name: 'Commercial / product', label: 'Commercial / products' }
            - { name: 'Personal projects', label: 'Personal projects' }
            - { name: 'Other', label: 'Other' }
      - name: photos
        label: Album Photos
        type: image
        required: true
        description: Upload or select photos together. The first photo is the album cover for new sessions.
        options:
          multiple:
            min: 1
          unique: true
          rename: random
          extensions: [jpg, jpeg, png, webp]
